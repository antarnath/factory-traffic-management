# Alembic configuration.
# The actual database URL is loaded from `app.config.settings.db_url`
# (which itself reads from the .env file). The value below is only used
# if Alembic is run without app config being importable.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///./factory_traffic.db

# Migration filename template.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone for revision timestamps. UTC is the only sensible default.
timezone = UTC

# Max identifier length.
truncate_slug_length = 40

# Set in `alembic/env.py` programmatically.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
